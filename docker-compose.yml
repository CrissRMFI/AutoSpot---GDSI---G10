# ══════════════════════════════════════════════════════════════════════════════
# Docker Compose — AutoSpot
#
# Servicios:
#   - db: PostgreSQL principal del proyecto
#   - web: Backend FastAPI
#
# Uso:
#   Levantar todo:
#     docker compose up --build
#
#   Levantar solo la base de datos:
#     docker compose up db -d
#
#   Detener contenedores:
#     docker compose down
#
#   Detener y borrar volumen de PostgreSQL:
#     docker compose down -v
# ══════════════════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16
    container_name: autospot_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - autospot_postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ./backend
    container_name: autospot_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"

volumes:
  autospot_postgres_data:
