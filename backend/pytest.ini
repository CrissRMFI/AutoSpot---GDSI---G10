[pytest]
# pytest.ini — Configuración de la suite de tests de AutoSpot Backend

# Directorio donde pytest busca los tests
testpaths = tests

# Agrega el directorio raíz del backend al PYTHONPATH,
# permitiendo imports del estilo `from app.models.usuario import Usuario`
pythonpath = .

# Formato de salida más descriptivo
addopts = -v --tb=short
