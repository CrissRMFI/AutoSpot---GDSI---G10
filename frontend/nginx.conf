server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite/React SPA:
    # Si la ruta no existe como archivo real, devuelve index.html
    # para que React Router maneje la navegación.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache básico para assets estáticos generados por Vite.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}